plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mirrorsorter.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mirrorsorter.app"
        minSdk 26
        targetSdk 34
        versionCode 35
        versionName "0.1.5.28e"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        python {
            version "3.12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 本工程无任何 Python pip 依赖(app.py 纯标准库), 亦无 AndroidX 依赖
